# Environment-independent settings for kube-prometheus-stack (PLAN.md phase 1).
# Environment overrides live in environments/<env>/kube-prometheus-stack.yaml.
#
# Platform components run on the system pool with the platform priority class.
# Nothing here tolerates the database taint, so monitoring never lands on
# database nodes.
prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors, PodMonitors, PrometheusRules and ScrapeConfigs
    # from every namespace, not only from the release's own.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    nodeSelector:
      pool: system
    priorityClassName: dbaas-platform
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
alertmanager:
  alertmanagerSpec:
    nodeSelector:
      pool: system
    priorityClassName: dbaas-platform
grafana:
  # The admin Secret is created once by hack/platform-up.sh and kept. Letting the
  # chart generate it regenerates the password on every apply, because the chart
  # only reuses a password it can look up at render time.
  admin:
    existingSecret: dbaas-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  nodeSelector:
    pool: system
  priorityClassName: dbaas-platform
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: false
prometheusOperator:
  nodeSelector:
    pool: system
  priorityClassName: dbaas-platform
kube-state-metrics:
  nodeSelector:
    pool: system
  priorityClassName: dbaas-platform
  # Node labels the capacity alerts need (PLAN.md 7.2, DbNoHeadroom).
  metricLabelsAllowlist:
    - nodes=[dbaas.local/node-class,topology.kubernetes.io/zone]
  # The MariaDB resource and its PITR state, read as metrics (PLAN.md phase 8, step 1).
  # Rules: alerts/db-alerts state.yaml. Names: dbaas_mariadb_* and dbaas_pitr_*.
  rbac:
    extraRules:
      - apiGroups: ["k8s.mariadb.com"]
        resources: ["mariadbs", "pointintimerecoveries"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: k8s.mariadb.com
              version: v1alpha1
              kind: MariaDB
            metricNamePrefix: dbaas_mariadb
            labelsFromPath:
              namespace: [metadata, namespace]
              name: [metadata, name]
            metrics:
              - name: ready
                help: "The Ready condition of the MariaDB resource, one series per status"
                each:
                  type: StateSet
                  stateSet:
                    labelName: ready_status
                    path: [status, conditions]
                    labelFromKey: type
                    list: ["True", "False", "Unknown"]
                    valueFrom: [status]
          - groupVersionKind:
              group: k8s.mariadb.com
              version: v1alpha1
              kind: PointInTimeRecovery
            metricNamePrefix: dbaas_pitr
            labelsFromPath:
              namespace: [metadata, namespace]
              name: [metadata, name]
            metrics:
              - name: last_recoverable_time_seconds
                help: "Unix time of the newest position the archive can restore"
                each:
                  type: Gauge
                  gauge:
                    path: [status, lastRecoverableTime]
                    valueFrom: [status, lastRecoverableTime]
prometheus-node-exporter:
  # Explicitly empty: the DaemonSet must not run on the tainted database pool.
  tolerations: []
  priorityClassName: dbaas-platform
