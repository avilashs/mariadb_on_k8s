{{- /* One ConfigMap per dashboard. The Grafana sidecar loads ConfigMaps labelled grafana_dashboard=1. */ -}}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dbaas-dashboard-{{ base $path | trimSuffix ".json" }}
  namespace: {{ $.Values.namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: dbaas
  annotations:
    grafana_folder: {{ $.Values.folder | quote }}
data:
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
