suite: databases, users and grants
templates:
  - templates/access.yaml
values:
  - ../ci/premium.yaml
tests:
  - it: creates a database, its owning user and a grant, in the instance namespace
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: Database
        documentIndex: 0
      - isKind:
          of: User
        documentIndex: 1
      - isKind:
          of: Grant
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: db-orders
        documentIndex: 2
  - it: reads the owner's password from a per-instance Secret, never from the chart
    asserts:
      - equal:
          path: spec.passwordSecretKeyRef.name
          value: orders-orders-app-credentials
        documentIndex: 1
      - notExists:
          path: spec.passwordSecretKeyRef.generate
        documentIndex: 1
      - notExists:
          path: spec.password
        documentIndex: 1
  - it: renders nothing when no database is requested
    set:
      access.databases: []
    asserts:
      - hasDocuments:
          count: 0
  - it: rejects a database name that breaks the rule
    set:
      access.databases:
        - name: Orders-DB
          owner: orders_app
    asserts:
      - failedTemplate:
          errorMessage: "database name \"Orders-DB\" must match ^[a-z][a-z0-9_]{0,30}$"
