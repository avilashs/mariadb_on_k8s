{{- /*
Network isolation of one instance (PLAN.md phase 11, step 1). Ingress is limited to the
instance's own pods (replication, the canary and the agent), the operator, monitoring and the
namespaces listed in access.allowedNamespaces. Egress is not restricted here: backups and the
object store need it.
*/ -}}
{{- $name := include "dbaas.instanceName" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-isolation
  namespace: db-{{ $name }}
  labels:
    app.kubernetes.io/part-of: dbaas
    app.kubernetes.io/instance: {{ $name | quote }}
spec:
  # Database pods only. The canary is measured from outside the isolation of its own pods.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/instance: {{ $name | quote }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $name | quote }}
        # Backup, restore and replay jobs of the instance (labelled through podMetadata of the PhysicalBackups).
        - podSelector:
            matchLabels:
              dbaas.local/instance: {{ $name | quote }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mariadb-system
        {{- if .Values.monitoring.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        {{- end }}
        {{- range .Values.access.allowedNamespaces | default list }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: 3306
          protocol: TCP
        - port: 5555
          protocol: TCP
        - port: 5566
          protocol: TCP
        - port: 9104
          protocol: TCP
{{- $pe := .Values.access.publicEndpoint | default dict }}
{{- if $pe.enabled }}
    # The public endpoint: only the listed source ranges, only the SQL port.
    - from:
        {{- range $pe.sourceRanges }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 3306
          protocol: TCP
{{- end }}
