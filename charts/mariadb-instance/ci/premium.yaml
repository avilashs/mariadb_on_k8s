# Example: a small instance on the premium-ssd-v2 node class of the kind environment.
name: orders
size: small
replicas: 2
nodeClass: kind-pv2
access:
  databases:
    - name: orders
      owner: orders_app
catalogue:
  storageTiers:
    premium-ssd-v2:
      provisioner: rancher.io/local-path
      parameters: {}
      perClassParameters: false
    local-nvme:
      provisioner: rancher.io/local-path
      parameters: {}
      perClassParameters: false
  storageClasses:
    db-pv2:
      tier: premium-ssd-v2
      iops: 3000
      throughputMbps: 125
    db-pv2-fast:
      tier: premium-ssd-v2
      iops: 16000
      throughputMbps: 500
    db-nvme:
      tier: local-nvme
  nodeClasses:
    kind-pv2:
      storageTier: premium-ssd-v2
      storageClassName: db-pv2
      vmSize: kind-node
    kind-nvme:
      storageTier: local-nvme
      storageClassName: db-nvme
      vmSize: kind-node
