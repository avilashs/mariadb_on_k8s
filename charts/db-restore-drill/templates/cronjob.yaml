apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-restore-drill
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: dbaas
    app.kubernetes.io/name: db-restore-drill
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: db-restore-drill
            app.kubernetes.io/part-of: dbaas
        spec:
          serviceAccountName: db-restore-drill
          restartPolicy: Never
          priorityClassName: {{ .Values.priorityClassName }}
          nodeSelector:
            {{- toYaml .Values.nodeSelector | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drill
              image: {{ .Values.image | quote }}
              command: ["bash", "/scripts/restore-drill.sh", "--all"]
              env:
                - name: RESTORE_INSTANCE
                  value: /scripts/restore-instance.sh
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: db-restore-drill-scripts
                defaultMode: 0555
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
