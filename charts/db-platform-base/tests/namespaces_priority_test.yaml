suite: namespaces and priority classes
templates:
  - templates/namespaces.yaml
  - templates/priorityclasses.yaml
values:
  - ../ci/kind.yaml
tests:
  - it: creates the platform namespaces with their pod security levels
    template: templates/namespaces.yaml
    asserts:
      - hasDocuments:
          count: 3
      # Sorted keys: 0 dbaas-system, 1 mariadb-system, 2 monitoring.
      - equal:
          path: metadata.name
          value: dbaas-system
        documentIndex: 0
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: baseline
        documentIndex: 0
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: baseline
        documentIndex: 1
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: privileged
        documentIndex: 2
  - it: creates two non-default priority classes with the plan's values
    template: templates/priorityclasses.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: value
          value: 1000000
        documentIndex: 0
      - equal:
          path: value
          value: 900000
        documentIndex: 1
      - equal:
          path: globalDefault
          value: false
        documentIndex: 0
