apiVersion: v1
kind: ServiceAccount
metadata:
  name: drain-guard
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: dbaas
---
# Reads nodes, pods and MariaDB resources; moves the primary (patch on MariaDB only); records
# events; holds the leader lease. Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: drain-guard
  labels:
    app.kubernetes.io/part-of: dbaas
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.mariadb.com"]
    resources: ["mariadbs"]
    verbs: ["get", "list", "watch", "patch"]
  # Point in time recovery baselines: after a primary change the guard requests one backup of the
  # PhysicalBackup that the instance's PointInTimeRecovery names.
  - apiGroups: ["k8s.mariadb.com"]
    resources: ["pointintimerecoveries"]
    verbs: ["get"]
  - apiGroups: ["k8s.mariadb.com"]
    resources: ["physicalbackups"]
    verbs: ["get", "patch"]
  # PostgreSQL (CloudNativePG): move a primary off a draining node by requesting a switchover, the way
  # `kubectl cnpg promote` does (a patch of the Cluster's status).
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters/status"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: drain-guard
  labels:
    app.kubernetes.io/part-of: dbaas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: drain-guard
subjects:
  - kind: ServiceAccount
    name: drain-guard
    namespace: {{ .Release.Namespace }}
