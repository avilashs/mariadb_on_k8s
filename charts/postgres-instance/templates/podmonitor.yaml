{{- $name := include "dbaas.instanceName" . -}}
{{- if .Values.monitoring.enabled }}
# CloudNativePG's own metrics endpoint (port metrics), scraped by the monitoring Prometheus.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $name }}
  namespace: db-{{ $name }}
  labels:
    app.kubernetes.io/part-of: dbaas
    dbaas.local/engine: postgres
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ $name | quote }}
  podMetricsEndpoints:
    - port: metrics
      interval: {{ .Values.monitoring.scrapeInterval }}
{{- end }}
