{{- if .Values.backup.enabled }}
{{- $name := include "dbaas.instanceName" . -}}
{{- $store := required "catalogue.backupStore is required when backup.enabled" .Values.catalogue.backupStore -}}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $name }}
  namespace: db-{{ $name }}
  labels:
    app.kubernetes.io/part-of: dbaas
    dbaas.local/engine: postgres
spec:
  configuration:
    destinationPath: {{ printf "s3://%s/%s/" $store.bucket $name | quote }}
    endpointURL: {{ printf "%s://%s" (ternary "https" "http" (default false $store.tls)) $store.endpoint | quote }}
    s3Credentials:
      accessKeyId:
        name: dbaas-backup-store
        key: access-key-id
      secretAccessKey:
        name: dbaas-backup-store
        key: secret-access-key
      region:
        name: dbaas-backup-store
        key: region
    wal:
      compression: gzip
    data:
      compression: gzip
  # CloudNativePG counts days, weeks or months: 720h becomes 30d.
  retentionPolicy: {{ if hasSuffix "h" .Values.backup.retention }}{{ printf "%dd" (div (atoi (trimSuffix "h" .Values.backup.retention)) 24) | quote }}{{ else }}{{ .Values.backup.retention | quote }}{{ end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $name }}-backup
  namespace: db-{{ $name }}
  labels:
    app.kubernetes.io/part-of: dbaas
    dbaas.local/engine: postgres
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  immediate: true
  backupOwnerReference: self
  cluster:
    name: {{ $name }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
