name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"   # nightly: rotation and chaos suites
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      has-e2e: ${{ steps.detect.outputs.has-e2e }}
      has-nightly: ${{ steps.detect.outputs.has-nightly }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Cache tools
        uses: actions/cache@v4
        with:
          # Only what the build cannot cheaply recreate. The Go module and build
          # caches are excluded: they are large, saving them took 25 minutes, and
          # the tools are already built into .bin.
          path: |
            .bin
            .cache/venv
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.yaml', 'hack/install-tools.sh') }}
      - name: Install pinned tools
        run: make tools
      - name: Check tools and verify
        run: make tools-check verify
      - name: Detect e2e suites
        id: detect
        run: |
          if compgen -G 'tests/e2e/*.sh' >/dev/null; then echo "has-e2e=true"; else echo "has-e2e=false"; fi >>"$GITHUB_OUTPUT"
          if [[ -f tests/e2e/rotation.sh ]]; then echo "has-nightly=true"; else echo "has-nightly=false"; fi >>"$GITHUB_OUTPUT"

  # The e2e jobs start running by themselves once later phases add suites
  # under tests/e2e/. Until then they are skipped, not faked.
  e2e:
    name: e2e (${{ matrix.engine }})
    needs: verify
    if: needs.verify.outputs.has-e2e == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [mariadb, postgres]
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Cache tools
        uses: actions/cache@v4
        with:
          # Only what the build cannot cheaply recreate. The Go module and build
          # caches are excluded: they are large, saving them took 25 minutes, and
          # the tools are already built into .bin.
          path: |
            .bin
            .cache/venv
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.yaml', 'hack/install-tools.sh') }}
      - run: make tools
      - name: Create kind cluster
        timeout-minutes: 20
        run: make kind-up
      - name: Install platform
        timeout-minutes: 30
        run: make platform-up
      - name: Sync instances
        timeout-minutes: 30
        run: make instances-up
      - name: Acceptance suites
        timeout-minutes: 60
        run: make e2e
      - name: Collect cluster diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          kind export logs diagnostics/kind-logs --name dbaas || true
          kubectl --context kind-dbaas get pods,events -A -o wide > diagnostics/pods-and-events.txt 2>&1 || true
          kubectl --context kind-dbaas get nodes -o yaml > diagnostics/nodes.yaml 2>&1 || true
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.engine }}
          path: diagnostics
          if-no-files-found: ignore
          retention-days: 14

  e2e-nightly:
    name: nightly ${{ matrix.suite }}
    needs: verify
    if: needs.verify.outputs.has-nightly == 'true' && github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        suite: [rotation, chaos]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Cache tools
        uses: actions/cache@v4
        with:
          # Only what the build cannot cheaply recreate. The Go module and build
          # caches are excluded: they are large, saving them took 25 minutes, and
          # the tools are already built into .bin.
          path: |
            .bin
            .cache/venv
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.yaml', 'hack/install-tools.sh') }}
      - run: make tools
      - name: Create kind cluster
        timeout-minutes: 20
        run: make kind-up
      - name: Install platform
        timeout-minutes: 30
        run: make platform-up
      - name: Sync instances
        timeout-minutes: 30
        run: make instances-up
      - name: Suite
        timeout-minutes: 200
        run: make e2e-${{ matrix.suite }}
