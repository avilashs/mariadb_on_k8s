name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"   # nightly: rotation and chaos suites
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      has-e2e: ${{ steps.detect.outputs.has-e2e }}
      has-nightly: ${{ steps.detect.outputs.has-nightly }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: |
            .bin
            .cache/venv
            ~/go/pkg/mod
            ~/.cache/go-build
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.yaml', 'hack/install-tools.sh') }}
      - name: Install pinned tools
        run: make tools
      - name: Check tools and verify
        run: make tools-check verify
      - name: Detect e2e suites
        id: detect
        run: |
          if compgen -G 'tests/e2e/*.sh' >/dev/null; then echo "has-e2e=true"; else echo "has-e2e=false"; fi >>"$GITHUB_OUTPUT"
          if [[ -f tests/e2e/rotation.sh ]]; then echo "has-nightly=true"; else echo "has-nightly=false"; fi >>"$GITHUB_OUTPUT"

  # The e2e jobs start running by themselves once later phases add suites
  # under tests/e2e/. Until then they are skipped, not faked.
  e2e:
    name: e2e (${{ matrix.engine }})
    needs: verify
    if: needs.verify.outputs.has-e2e == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [mariadb, postgres]
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: |
            .bin
            .cache/venv
            ~/go/pkg/mod
            ~/.cache/go-build
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.yaml', 'hack/install-tools.sh') }}
      - run: make tools
      - run: make kind-up platform-up
      - run: make e2e

  e2e-nightly:
    name: nightly ${{ matrix.suite }}
    needs: verify
    if: needs.verify.outputs.has-nightly == 'true' && github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        suite: [rotation, chaos]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: |
            .bin
            .cache/venv
            ~/go/pkg/mod
            ~/.cache/go-build
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.yaml', 'hack/install-tools.sh') }}
      - run: make tools
      - run: make kind-up platform-up
      - run: make e2e-${{ matrix.suite }}
